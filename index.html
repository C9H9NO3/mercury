<!doctype html>
<!-- html/body start in the app bg (inline) so the launch -> page crossfade is bg -> bg. -->
<html lang="en" style="background:#10101a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10101a">
<link rel="manifest" href="manifest.json?v=5">
<link rel="apple-touch-icon" href="icon.png?v=5">
<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="launch_1290x2796.png?v=5">
<link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="launch_1179x2556.png?v=5">
<title>Mercury</title>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update());
  navigator.serviceWorker.addEventListener('message',(e)=>{
    if(e.data&&e.data.type==='shell-updated'&&performance.now()<1200)location.reload();
  });
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    scrollbar-width:none;-ms-overflow-style:none;}
  ::-webkit-scrollbar{display:none;width:0;height:0;}
  /* Viewport height. Installed (standalone) iOS web apps with black-translucent report
     100dvh / innerHeight ~59pt short on cold start (WebKit bug 254868) -> 59pt dead band
     under the tab bar. 100vh fills the real screen there. In Safari keep dvh. */
  :root{--vh:100dvh;}
  @media (display-mode:standalone){:root{--vh:100vh;}}
  html{background:#10101a;-webkit-text-size-adjust:100%;}
  body{background:#10101a;min-height:var(--vh);overflow-x:hidden;
       font-family:-apple-system,"SF Pro Text",sans-serif;touch-action:manipulation;}
  img{-webkit-user-drag:none;}
  #app{position:relative;min-height:var(--vh);background:#10101a;overflow-x:hidden;}
  #stage{position:relative;min-height:var(--vh);background:#10101a;}
  .screen{display:none;width:100%;background:#10101a;position:relative;}
  .screen.active{display:block;}
  .screen.animating{position:absolute;top:0;left:0;z-index:50;}
  .sheet{position:relative;width:100%;}
  .sheet > img{display:block;width:100%;height:auto;position:relative;z-index:1;}
  .hot{position:absolute;background:transparent;z-index:5;}

  /* Home: the body scrolls full-height under floating chrome, like the real app.
     The org pill, the icon pill and the tab bar are glass capsules
     (backdrop blur + dark tint) with their glyphs as alpha PNGs on top.
     Body PNG carries the 177 px status-bar paint at scroll 0; nothing else
     is opaque, so content passes under the clock, the pills and the bar. */
  #s-home.active, #s-home.animating{display:block;position:relative;height:var(--vh);overflow:hidden;}
  /* Startup: launch image is flat bg, page stays flat bg (opacity 0) until every home PNG
     has decoded, then the whole screen fades in once. No partial paint, no flash. */
  #s-home{opacity:0;transition:opacity .3s ease-out;}
  #s-home.ready{opacity:1;}
  #homeScroller{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;
                -webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#10101a;}
  #homeContent{position:relative;width:100%;background:#10101a;}
  #homeContent img{display:block;width:100%;}
  /* scroll-edge dims, measured on IMG_1510/1511 tops and folder (23) crop (see CROP.md):
     top: .87 under the clock, .78 at the pill row (177 px), gone by 340 px.
     bottom: 0 at 92 px above the bar (2455), .85 from the bar's bottom edge (2733) down. */
  #homeTopFade,#homeBotFade{position:absolute;left:0;width:100%;z-index:6;pointer-events:none;}
  #homeTopFade{top:0;height:26.357vw;
               background:linear-gradient(rgba(16,16,26,.87) 0%,rgba(16,16,26,.78) 52%,rgba(16,16,26,0) 100%);}
  #homeBotFade{bottom:0;height:26.434vw;
               background:linear-gradient(rgba(16,16,26,0) 0%,rgba(16,16,26,.85) 81.5%,rgba(16,16,26,.85) 100%);}
  /* glass: capsule fill reads (30,30,43) over the page bg (16,16,26) -> rgba(33.5,33.5,47.3,.8).
     alpha/blur fitted against IMG_1509 (bar over the Debit Card row) and folder (23)
     FullSizeRender-1.jpeg (bar over the Apple row) */
  #s-home{--gfill:rgba(33.5,33.5,47.3,.8);--gblur:3px;}
  .glass{position:absolute;border-radius:50vw;background:var(--gfill);
         -webkit-backdrop-filter:blur(var(--gblur));backdrop-filter:blur(var(--gblur));
         z-index:7;pointer-events:none;}
  .glyph{position:absolute;z-index:8;pointer-events:none;-webkit-user-drag:none;}
  /* geometry = bounding boxes measured on the 1290-wide originals (see screens/CROP.md) */
  #gL,#yL{left:4.651vw;top:13.721vw;width:40.31vw;height:10.233vw;}
  #gR,#yR{left:73.023vw;top:13.721vw;width:22.326vw;height:10.233vw;}
  #gB,#yB{left:4.884vw;bottom:4.884vw;width:90.233vw;height:14.419vw;}
  /* fallback: add class "noglass" to #s-home for opaque capsules (no blur) */
  #s-home.noglass .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:#1e1e2b;}
</style>
</head>
<body style="background:#10101a">
<div id="app">
  <div id="stage">

    <div class="screen active" id="s-home">
      <div id="homeScroller">
        <div id="homeContent">
          <img src="screens/home_body.png?v=5">
          <!-- Insights >, Cards >, Transactions >, Accounts > rows: inert until
               destination shots exist. Row positions in screens/CROP.md -->
        </div>
      </div>
      <div id="homeTopFade"></div><div id="homeBotFade"></div>
      <!-- floating chrome: org pill / icon pill / tab bar. Inert until destination shots exist. -->
      <div class="glass" id="gL"></div><img class="glyph" id="yL" src="screens/pill_left.png?v=5" alt="">
      <div class="glass" id="gR"></div><img class="glyph" id="yR" src="screens/pill_right.png?v=5" alt="">
      <div class="glass" id="gB"></div><img class="glyph" id="yB" src="screens/tabbar.png?v=5" alt="">
    </div>

  </div>
</div>
<script>
  const ASSET_V = '?v=5';
  const el = id => document.getElementById(id);
  let current = 's-home';
  let navBusy = false;

  function go(id, mode){
    if (id === current || navBusy) return;
    navBusy = true;
    const incoming = el(id), outgoing = el(current);
    if (!incoming){ navBusy = false; return; }
    if (mode === 'back'){
      window.scrollTo(0, 0);
      incoming.classList.add('active');
      outgoing.classList.add('animating');
      outgoing.style.transition = 'transform .34s cubic-bezier(.3,.7,.3,1)';
      outgoing.getBoundingClientRect();
      outgoing.style.transform = 'translateX(100%)';
      const doneB = () => {
        outgoing.removeEventListener('transitionend', doneB);
        outgoing.classList.remove('active', 'animating');
        outgoing.style.cssText = '';
        current = id;
        navBusy = false;
      };
      outgoing.addEventListener('transitionend', doneB);
      setTimeout(() => { if (current !== id) doneB(); }, 700);
      return;
    }
    incoming.style.transition = 'none';
    incoming.style.transform = 'translateX(100%)';
    incoming.classList.add('active', 'animating');
    incoming.getBoundingClientRect();
    incoming.style.transition = 'transform .34s cubic-bezier(.3,.7,.3,1)';
    incoming.style.transform = 'translateX(0)';
    const done = () => {
      incoming.removeEventListener('transitionend', done);
      incoming.classList.remove('animating');
      incoming.style.transition = incoming.style.transform = incoming.style.opacity = '';
      if (outgoing !== incoming){ outgoing.classList.remove('active'); outgoing.style.cssText = ''; }
      current = id;
      navBusy = false;
      window.scrollTo(0, 0);
    };
    incoming.addEventListener('transitionend', done);
    setTimeout(() => { if (current !== id) done(); }, 700);
  }

  function swapAfterDecode(imgs, apply){
    const jobs = imgs.filter(Boolean).map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()));
    Promise.all(jobs).then(apply, apply);
  }

  // First paint: hold flat bg until body + pills + tab bar are decoded, then fade in once.
  (() => {
    const home = el('s-home');
    let shown = false;
    const show = () => {
      if (shown) return;
      shown = true;
      requestAnimationFrame(() => home.classList.add('ready'));
    };
    swapAfterDecode(Array.from(home.querySelectorAll('img')), show);
    setTimeout(show, 2500); // never stay blank if decode() hangs
  })();

  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
</script>
</body>
</html>
